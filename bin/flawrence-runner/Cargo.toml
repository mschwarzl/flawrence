[package]
name = "flawrence-runner"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "flawrence-web"
path = "src/web.rs"

[dependencies]
flawrence-chat = { path = "../../lib/flawrence-chat" }
flawrence-api = { path = "../../lib/flawrence-api" }
flawrence-agent = { path = "../../lib/flawrence-agent" }
flawrence-index = { path = "../../lib/flawrence-index" }
flawrence-tool = { path = "../../lib/flawrence-tool" }
flawrence-task = { path = "../../lib/flawrence-task" }
flawrence-status = { path = "../../lib/flawrence-status" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
tokio = { version = "1.49", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ratatui = "0.29"
axum = "0.8"
base64 = "0.22"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
futures = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
