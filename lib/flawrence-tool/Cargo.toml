[package]
name = "flawrence-tool"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
flawrence-chat = { path = "../flawrence-chat" }
flawrence-index = { path = "../flawrence-index" }
flawrence-agent = { path = "../flawrence-agent" }
flawrence-api = { path = "../flawrence-api" }

anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
chrono = { version = "0.4.43", features = ["serde"] }
futures = "0.3"
glob = "0.3.3"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1.49", features = ["full", "process"] }
tokio-stream = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
