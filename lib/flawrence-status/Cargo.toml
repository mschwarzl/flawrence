[package]
name = "flawrence-status"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
flawrence-task = { path = "../../lib/flawrence-task" }
flawrence-tool = { path = "../../lib/flawrence-tool" }
flawrence-agent = { path = "../../lib/flawrence-agent" }
flawrence-chat = { path = "../../lib/flawrence-chat" }

anyhow = "1.0"
axum = { version = "0.8", features = ["tokio"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["sync"] }
tracing = "0.1"
tokio-stream = "0.1"
futures = "0.3"
chrono = { version = "0.4.43", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
