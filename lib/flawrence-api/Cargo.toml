[package]
name = "flawrence-api"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
flawrence-chat = { path = "../flawrence-chat" }

anyhow = "1.0"
async-openai = { version = "0.33", default-features = false, features = ["chat-completion", "responses", "byot", "rustls"] }
async-trait = "0.1"
futures = "0.3"
anthropic-async = "0.5"
reqwest = { version = "0.13", features = ["json"] }
reqwest_compat = { package = "reqwest", version = "0.12", default-features = false }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["time", "process", "sync"] }
tracing = "0.1"
