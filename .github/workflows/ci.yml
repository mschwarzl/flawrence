name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the default GITHUB_TOKEN is read-only for this workflow.
# No job needs write access or secrets, so nothing is granted.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save resources.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build-test-run:
    name: Build, test and run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (not moving tags) to prevent a
      # compromised/re-tagged upstream action from running in this repo.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Do not leave the GITHUB_TOKEN in .git/config; dependency build
          # scripts run during `cargo build` and must not be able to read it.
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt

      # Fail fast on formatting before the expensive build and test steps.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test launcher UI
        run: node --test bin/flawrence-runner/src/launcher.test.cjs

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      # `--locked` builds strictly from the committed Cargo.lock, so CI cannot
      # silently pull in a different dependency version than was reviewed.
      - name: Build
        run: cargo build --workspace --release --locked

      - name: Test
        run: cargo test --workspace --release --locked

      # Smoke-run the built binary. `--help` exercises the real executable
      # without needing any API keys or secrets.
      - name: Run flawrence-runner (smoke check)
        run: ./target/release/flawrence-runner --help
