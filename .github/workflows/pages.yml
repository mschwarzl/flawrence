name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - FINDINGS.md
      - bin/flawrence-runner/src/harp.svg
      - bin/flawrence-runner/src/launcher.html
      - .github/workflows/pages.yml
  workflow_dispatch:

# The build job only reads the repository. The deploy job gets the two
# permissions GitHub Pages needs and nothing else.
permissions:
  contents: read

# Let a running deployment finish; only the newest queued one replaces older ones.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: 0.23.6
  ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs, like in ci.yml.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install Zola
        run: |
          curl -fsSL -o zola.tar.gz "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum --check
          tar -xzf zola.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Import branding, findings and docs
        run: python3 website/prepare.py

      # The Pages URL comes from the repository settings, so a custom domain works without edits.
      - name: Build site
        working-directory: website
        run: zola build --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
